name: Build and Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: If true, deploys HTTP-only ingress and prints ALB DNS (no Route53/ACM)
        required: false
        type: boolean
        default: true
      langflow_seed_image:
        description: DockerHub image (e.g. username/repo:tag) containing /seed/langflow.db
        required: false
        type: string
      flow_id:
        description: Override FLOW_ID (optional)
        required: false
        type: string
      public_domain:
        description: Public domain for HTTPS ingress (required when demo_mode=false)
        required: false
        type: string
      alb_acm_arn:
        description: ACM certificate ARN for HTTPS ingress (required when demo_mode=false)
        required: false
        type: string
      provision_agent_demo_resources:
        description: Create/update the AWS Bedrock + S3 agent demo resources
        required: false
        type: boolean
        default: true
      bedrock_model_id:
        description: Optional Bedrock model ID override for the agent demo
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  build_scan_push_deploy:
    runs-on: ubuntu-latest

    env:
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      EKS_REGION: ${{ vars.EKS_REGION }}

      ECR_REGION: ${{ vars.ECR_REGION }}
      ECR_ACCOUNT: ${{ vars.ECR_ACCOUNT }}
      ECR_REPO: ${{ vars.ECR_REPO }}

      PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
      ALB_ACM_ARN: ${{ vars.ALB_ACM_ARN }}
      FLOW_ID: ${{ vars.FLOW_ID }}

      MONGO_USER: ${{ secrets.MONGO_USER }}
      MONGO_PASS: ${{ secrets.MONGO_PASS }}
      MONGO_HOST: ${{ secrets.AWS_MONGO_HOST || secrets.MONGO_HOST }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}
      AGENT_STORAGE_PROVIDER: ${{ vars.AGENT_STORAGE_PROVIDER }}
      AGENT_PII_BUCKET: ${{ vars.AGENT_PII_BUCKET }}
      AGENT_CUSTOMER_OBJECT: ${{ vars.AGENT_CUSTOMER_OBJECT }}
      AGENT_PAYMENTS_OBJECT: ${{ vars.AGENT_PAYMENTS_OBJECT }}
      AGENT_DEMO_UNSAFE: ${{ vars.AGENT_DEMO_UNSAFE }}
      AWS_REGION: ${{ vars.AWS_REGION || vars.EKS_REGION }}
      AWS_TERRAFORM_BACKEND_REGION: ${{ vars.AWS_TERRAFORM_BACKEND_REGION || vars.AWS_REGION || vars.ECR_REGION || vars.EKS_REGION }}
      AWS_AGENT_ROLE_ARN: ${{ vars.AWS_AGENT_ROLE_ARN }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_AGENT_ID: ${{ vars.BEDROCK_AGENT_ID }}
      BEDROCK_AGENT_ALIAS_ID: ${{ vars.BEDROCK_AGENT_ALIAS_ID }}
      VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID }}
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
      VERTEX_MODEL_ID: ${{ vars.VERTEX_MODEL_ID }}

      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "${ECR_REPO}" --region "${ECR_REGION}" >/dev/null 2>&1 || \
            aws ecr create-repository \
              --repository-name "${ECR_REPO}" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --region "${ECR_REGION}" >/dev/null

      - name: Set up Terraform
        if: ${{ inputs.provision_agent_demo_resources }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap Terraform backend
        id: tf_backend
        if: ${{ inputs.provision_agent_demo_resources }}
        run: |
          set -euo pipefail

          backend_region="${AWS_TERRAFORM_BACKEND_REGION:-${AWS_REGION:-${EKS_REGION}}}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="starai-terraform-state-${account_id}-${backend_region}"
          lock_table="starai-terraform-locks"

          echo "[INFO] Ensuring Terraform state bucket exists: ${state_bucket}"
          if aws s3api head-bucket --bucket "${state_bucket}" >/dev/null 2>&1; then
            echo "[INFO] Terraform state bucket already exists"
          elif [[ "${backend_region}" == "us-east-1" ]]; then
            aws s3api create-bucket --bucket "${state_bucket}" --region "${backend_region}" >/dev/null
          else
            aws s3api create-bucket \
              --bucket "${state_bucket}" \
              --region "${backend_region}" \
              --create-bucket-configuration LocationConstraint="${backend_region}" >/dev/null
          fi

          aws s3api put-bucket-versioning \
            --bucket "${state_bucket}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${state_bucket}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "${state_bucket}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo "[INFO] Ensuring Terraform lock table exists: ${lock_table}"
          if aws dynamodb describe-table --table-name "${lock_table}" --region "${backend_region}" >/dev/null 2>&1; then
            echo "[INFO] Terraform lock table already exists"
          else
            aws dynamodb create-table \
              --table-name "${lock_table}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${backend_region}" >/dev/null
            aws dynamodb wait table-exists --table-name "${lock_table}" --region "${backend_region}"
          fi

          {
            echo "bucket=${state_bucket}"
            echo "dynamodb_table=${lock_table}"
            echo "region=${backend_region}"
          } >> "${GITHUB_OUTPUT}"

      - name: Provision AWS agent demo resources with Terraform
        id: agent_resources
        if: ${{ inputs.provision_agent_demo_resources }}
        env:
          INPUT_BEDROCK_MODEL_ID: ${{ inputs.bedrock_model_id }}
        run: |
          set -euo pipefail

          agent_region="${AWS_REGION:-${EKS_REGION}}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket_name="starai-agent-pii-demo-${account_id}-${agent_region}"

          oidc_issuer="$(aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${EKS_REGION}" \
            --query 'cluster.identity.oidc.issuer' \
            --output text)"
          oidc_hostpath="${oidc_issuer#https://}"
          oidc_host="${oidc_hostpath%%/*}"
          oidc_provider_arn="arn:aws:iam::${account_id}:oidc-provider/${oidc_hostpath}"

          if aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "${oidc_provider_arn}" >/dev/null 2>&1; then
            echo "[INFO] IAM OIDC provider already exists: ${oidc_provider_arn}"
          else
            echo "[INFO] Creating IAM OIDC provider: ${oidc_provider_arn}"
            thumbprint="$(
              echo | openssl s_client -servername "${oidc_host}" -showcerts -connect "${oidc_host}:443" 2>/dev/null |
                awk '/BEGIN CERTIFICATE/{cert=""} {cert=cert $0 ORS} /END CERTIFICATE/{last=cert} END{printf "%s", last}' |
                openssl x509 -fingerprint -noout -sha1 |
                cut -d= -f2 |
                tr -d :
            )"
            aws iam create-open-id-connect-provider \
              --url "${oidc_issuer}" \
              --client-id-list sts.amazonaws.com \
              --thumbprint-list "${thumbprint}" >/dev/null
          fi

          model_id="${INPUT_BEDROCK_MODEL_ID:-${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}}"
          role_name="starai-agent-pii-demo"
          policy_arn="arn:aws:iam::${account_id}:policy/starai-agent-pii-demo-access"

          tf_vars=(
            -var="aws_region=${agent_region}"
            -var="bucket_name=${bucket_name}"
            -var="eks_oidc_provider_arn=${oidc_provider_arn}"
            -var="eks_oidc_issuer_url=${oidc_issuer}"
          )

          terraform -chdir=infra/aws/agent-demo init \
            -backend-config="bucket=${{ steps.tf_backend.outputs.bucket }}" \
            -backend-config="key=starai-chatbot/aws-agent-demo.tfstate" \
            -backend-config="region=${{ steps.tf_backend.outputs.region }}" \
            -backend-config="dynamodb_table=${{ steps.tf_backend.outputs.dynamodb_table }}" \
            -backend-config="encrypt=true"

          terraform -chdir=infra/aws/agent-demo import "${tf_vars[@]}" aws_s3_bucket.starai_agent_pii "${bucket_name}" || true
          terraform -chdir=infra/aws/agent-demo import "${tf_vars[@]}" aws_iam_role.starai_agent "${role_name}" || true
          terraform -chdir=infra/aws/agent-demo import "${tf_vars[@]}" aws_iam_policy.starai_agent_pii_access "${policy_arn}" || true
          terraform -chdir=infra/aws/agent-demo import "${tf_vars[@]}" aws_iam_role_policy_attachment.starai_agent_pii_access "${role_name}/${policy_arn}" || true

          terraform -chdir=infra/aws/agent-demo apply -auto-approve "${tf_vars[@]}"

          role_arn="$(terraform -chdir=infra/aws/agent-demo output -raw agent_role_arn)"
          bucket_name="$(terraform -chdir=infra/aws/agent-demo output -raw agent_pii_bucket)"

          {
            echo "agent_provider=bedrock"
            echo "agent_storage_provider=s3"
            echo "agent_pii_bucket=${bucket_name}"
            echo "agent_demo_unsafe=true"
            echo "aws_agent_role_arn=${role_arn}"
            echo "aws_region=${agent_region}"
            echo "bedrock_model_id=${model_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute image tag
        id: meta
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=12 HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          TAG="${GITHUB_RUN_NUMBER}-${TS}-${SHA}"
          echo "img_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_ACCOUNT}.dkr.ecr.${ECR_REGION}.amazonaws.com/${ECR_REPO}" >> "$GITHUB_OUTPUT"

      #- name: Trivy repo scan
      #  uses: aquasecurity/trivy-action@0.22.0
      #  with:
      #   scan-type: fs
      #    scan-ref: .
      #    format: table
      #    exit-code: '0'
      #    ignore-unfixed: true

      - name: Download Wiz CLI
        run: |
          curl -o wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli
          ./wizcli version


      - name: Wiz CLI code scans (dir + iac + sensitive data)
        run: |
          set -euo pipefail
          mkdir -p wiz-reports

          ./wizcli dir scan --path . --policies=arun-vulnerabilities-policy,arun-secrets-policy,arun-sast-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/dir-scan-results.sarif || true
          ./wizcli iac scan --path . --types Kubernetes,GitHubActions,Terraform,Dockerfile --policies=arun-iac-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/iac-scan-results.sarif || true
          ./wizcli dir scan --path . --sensitive-data --policies=arun-sensitive-data-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/sensitive-data-scan-results.sarif || true
        continue-on-error: true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: build_gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.ecr_image }}:latest
            ${{ steps.meta.outputs.ecr_image }}:${{ steps.meta.outputs.img_tag }}

      - name: Wiz CLI docker scan + tag (gateway)
        run: |
          set -euo pipefail

          mkdir -p wiz-reports

          gateway_image="${{ steps.meta.outputs.ecr_image }}:${{ steps.meta.outputs.img_tag }}"
          langflow_image="langflowai/langflow:1.2.0"
          echo "[INFO] Pulling gateway image locally for docker-based scanning: ${gateway_image}"
          docker pull "${gateway_image}" || true

          echo "[INFO] Wiz docker scan (gateway): ${gateway_image}"
          ./wizcli docker scan --image "${gateway_image}" --dockerfile app/Dockerfile --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/docker-scan-gateway.sarif || true

          echo "[INFO] Wiz docker tag (gateway): ${gateway_image} digest=${{ steps.build_gateway.outputs.digest }}"
          ./wizcli docker tag --image "${gateway_image}" --digest "${{ steps.build_gateway.outputs.digest }}" || true

          echo "[INFO] Pulling langflow image locally for docker-based scanning: ${langflow_image}"
          docker pull "${langflow_image}" || true

          echo "[INFO] Wiz docker scan (langflow): ${langflow_image}"
          ./wizcli docker scan --image "${langflow_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/docker-scan-langflow.sarif || true

          langflow_repodiagest="$(docker inspect --format='{{index .RepoDigests 0}}' "${langflow_image}" 2>/dev/null || true)"
          langflow_digest="${langflow_repodiagest##*@}"
          if [[ -n "${langflow_digest}" ]]; then
            echo "[INFO] Wiz docker tag (langflow): ${langflow_image} digest=${langflow_digest}"
            ./wizcli docker tag --image "${langflow_image}" --digest "${langflow_digest}" || true
          else
            echo "[WARN] Could not determine langflow image digest (RepoDigests empty); skipping wizcli docker tag" >&2
          fi

      # - name: Trivy image scan (advisory)
      #  uses: aquasecurity/trivy-action@0.22.0
      #  with:
      #    image-ref: ${{ steps.meta.outputs.ecr_image }}:${{ steps.meta.outputs.img_tag }}
      #    format: table
      #    exit-code: '0'
      #    ignore-unfixed: true

      - name: Wiz CLI scan images deployed to EKS
        run: |
          set -euo pipefail

          mkdir -p wiz-reports

          gateway_image="${{ steps.meta.outputs.ecr_image }}:${{ steps.meta.outputs.img_tag }}"
          langflow_image="langflowai/langflow:1.2.0"

          echo "[INFO] Wiz scanning gateway image: ${gateway_image}"
          docker pull "${gateway_image}" || true
          ./wizcli scan container-image "${gateway_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-gateway.sarif || true

          echo "[INFO] Wiz scanning langflow image: ${langflow_image}"
          docker pull "${langflow_image}" || true
          ./wizcli scan container-image "${langflow_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-langflow.sarif || true

          if [[ -n "${{ inputs.langflow_seed_image }}" ]]; then
            seed_image_raw="${{ inputs.langflow_seed_image }}"
            if [[ "${seed_image_raw}" == *":"* ]]; then
              seed_image="docker.io/${seed_image_raw}"
            else
              seed_image="docker.io/${seed_image_raw}:latest"
            fi
            echo "[INFO] Wiz scanning langflow seed image: ${seed_image}"
            docker pull "${seed_image}" || true
            ./wizcli scan container-image "${seed_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-seed.sarif || true
          fi

      # - name: Upload Wiz SARIF reports
      #   if: ${{ always() && hashFiles('wiz-reports/*.sarif') != '' }}
      #   uses: ./.github/actions/upload-wiz-sarif

      - name: Prepare EKS config
        uses: ./.github/actions/prepare-eks-config
        with:
          kubectl_version: v1.29.0
          demo_mode: ${{ inputs.demo_mode }}
          public_domain: ${{ inputs.public_domain }}
          alb_acm_arn: ${{ inputs.alb_acm_arn }}

      - name: Deploy manifests to EKS
        env:
          ECR_IMAGE: ${{ steps.meta.outputs.ecr_image }}:latest
          ECR_IMAGE_TAGGED: ${{ steps.meta.outputs.ecr_image }}:${{ steps.meta.outputs.img_tag }}
          LANGFLOW_SEED_IMAGE: ${{ inputs.langflow_seed_image }}
          FLOW_ID: ${{ inputs.flow_id || vars.FLOW_ID }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain || vars.PUBLIC_DOMAIN }}
          ALB_ACM_ARN: ${{ inputs.alb_acm_arn || vars.ALB_ACM_ARN }}
          DEMO_MODE: ${{ inputs.demo_mode }}
          AGENT_PROVIDER: ${{ steps.agent_resources.outputs.agent_provider || vars.AGENT_PROVIDER }}
          AGENT_STORAGE_PROVIDER: ${{ steps.agent_resources.outputs.agent_storage_provider || vars.AGENT_STORAGE_PROVIDER }}
          AGENT_PII_BUCKET: ${{ steps.agent_resources.outputs.agent_pii_bucket || vars.AGENT_PII_BUCKET }}
          AGENT_DEMO_UNSAFE: ${{ steps.agent_resources.outputs.agent_demo_unsafe || vars.AGENT_DEMO_UNSAFE }}
          AWS_AGENT_ROLE_ARN: ${{ steps.agent_resources.outputs.aws_agent_role_arn || vars.AWS_AGENT_ROLE_ARN }}
          AWS_REGION: ${{ steps.agent_resources.outputs.aws_region || vars.AWS_REGION || vars.EKS_REGION }}
          BEDROCK_MODEL_ID: ${{ steps.agent_resources.outputs.bedrock_model_id || vars.BEDROCK_MODEL_ID }}
        run: |
          set -euo pipefail
          chmod +x ci/deploy.sh
          ./ci/deploy.sh
