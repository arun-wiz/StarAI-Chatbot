name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      demo_mode:
        description: Deploy HTTP-only ingress without custom DNS/TLS
        required: true
        default: true
        type: boolean
      public_domain:
        description: DNS name for the GKE ingress when demo_mode is false
        required: false
        type: string
      managed_certificate_name:
        description: ManagedCertificate resource name when demo_mode is false
        required: false
        default: chatbot-managed-cert
        type: string
      flow_id:
        description: Override FLOW_ID from repository variables
        required: false
        type: string
      langflow_seed_image:
        description: Optional fully-qualified seed image reference for langflow.db
        required: false
        type: string
      image_tag:
        description: Optional image tag override for the gateway container
        required: false
        type: string
      provision_agent_demo_resources:
        description: Create/update the GCP Vertex AI + GCS agent demo resources
        required: false
        default: true
        type: boolean
      vertex_model_id:
        description: Optional Vertex/Gemini model ID override for the agent demo
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
      GKE_LOCATION: ${{ vars.GKE_LOCATION }}
      GKE_STATIC_IP_NAME: ${{ vars.GKE_STATIC_IP_NAME }}
      DEFAULT_FLOW_ID: ${{ vars.FLOW_ID }}
      AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER }}
      AGENT_STORAGE_PROVIDER: ${{ vars.AGENT_STORAGE_PROVIDER }}
      AGENT_PII_BUCKET: ${{ vars.AGENT_PII_BUCKET }}
      AGENT_CUSTOMER_OBJECT: ${{ vars.AGENT_CUSTOMER_OBJECT }}
      AGENT_PAYMENTS_OBJECT: ${{ vars.AGENT_PAYMENTS_OBJECT }}
      AGENT_DEMO_UNSAFE: ${{ vars.AGENT_DEMO_UNSAFE }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_TERRAFORM_BACKEND_REGION: ${{ vars.AWS_TERRAFORM_BACKEND_REGION || vars.AWS_REGION || 'us-east-1' }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_AGENT_ID: ${{ vars.BEDROCK_AGENT_ID }}
      BEDROCK_AGENT_ALIAS_ID: ${{ vars.BEDROCK_AGENT_ALIAS_ID }}
      GCP_AGENT_SERVICE_ACCOUNT: ${{ vars.GCP_AGENT_SERVICE_ACCOUNT }}
      VERTEX_PROJECT_ID: ${{ vars.VERTEX_PROJECT_ID || vars.GCP_PROJECT_ID }}
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || vars.GKE_LOCATION }}
      VERTEX_MODEL_ID: ${{ vars.VERTEX_MODEL_ID }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Terraform backend
        if: ${{ inputs.provision_agent_demo_resources }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_TERRAFORM_BACKEND_REGION || vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        if: ${{ inputs.provision_agent_demo_resources }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Bootstrap Terraform backend
        id: tf_backend
        if: ${{ inputs.provision_agent_demo_resources }}
        run: |
          set -euo pipefail

          backend_region="${AWS_TERRAFORM_BACKEND_REGION:-us-east-1}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="starai-terraform-state-${account_id}-${backend_region}"
          lock_table="starai-terraform-locks"

          echo "[INFO] Ensuring Terraform state bucket exists: ${state_bucket}"
          if aws s3api head-bucket --bucket "${state_bucket}" >/dev/null 2>&1; then
            echo "[INFO] Terraform state bucket already exists"
          elif [[ "${backend_region}" == "us-east-1" ]]; then
            aws s3api create-bucket --bucket "${state_bucket}" --region "${backend_region}" >/dev/null
          else
            aws s3api create-bucket \
              --bucket "${state_bucket}" \
              --region "${backend_region}" \
              --create-bucket-configuration LocationConstraint="${backend_region}" >/dev/null
          fi

          aws s3api put-bucket-versioning \
            --bucket "${state_bucket}" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "${state_bucket}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "${state_bucket}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo "[INFO] Ensuring Terraform lock table exists: ${lock_table}"
          if aws dynamodb describe-table --table-name "${lock_table}" --region "${backend_region}" >/dev/null 2>&1; then
            echo "[INFO] Terraform lock table already exists"
          else
            aws dynamodb create-table \
              --table-name "${lock_table}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "${backend_region}" >/dev/null
            aws dynamodb wait table-exists --table-name "${lock_table}" --region "${backend_region}"
          fi

          {
            echo "bucket=${state_bucket}"
            echo "dynamodb_table=${lock_table}"
            echo "region=${backend_region}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate repo configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASS: ${{ secrets.MONGO_PASS }}
          MONGO_HOST: ${{ secrets.GCP_MONGO_HOST || secrets.MONGO_HOST }}
        run: |
          set -euo pipefail

          required_vars=(
            GCP_PROJECT_ID
            GAR_LOCATION
            GAR_REPOSITORY
            GKE_CLUSTER_NAME
            GKE_LOCATION
          )
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository variable: ${name}" >&2
              exit 1
            fi
          done

          if [[ "${GAR_REPOSITORY}" == *"/"* ]]; then
            echo "GAR_REPOSITORY must be only the Artifact Registry repository name, not a path: ${GAR_REPOSITORY}" >&2
            exit 1
          fi

          required_secrets=(
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_SERVICE_ACCOUNT
            MONGO_USER
            MONGO_PASS
            MONGO_HOST
          )
          for name in "${required_secrets[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository secret: ${name}" >&2
              exit 1
            fi
          done

          if [ "${{ inputs.demo_mode }}" != "true" ] && [ -z "${{ inputs.public_domain }}" ]; then
            echo "public_domain is required when demo_mode=false" >&2
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          set -euo pipefail

          if gcloud artifacts repositories describe "${GAR_REPOSITORY}" \
            --location "${GAR_LOCATION}" \
            --project "${GCP_PROJECT_ID}" >/dev/null 2>&1; then
            echo "Artifact Registry repository already exists: ${GAR_REPOSITORY}"
          else
            echo "Creating Artifact Registry repository: ${GAR_REPOSITORY}"
            gcloud artifacts repositories create "${GAR_REPOSITORY}" \
              --repository-format=docker \
              --location "${GAR_LOCATION}" \
              --description="Docker repository for StarAI Chatbot images" \
              --project "${GCP_PROJECT_ID}"
          fi

      - name: Grant GKE nodes Artifact Registry pull access
        run: |
          set -euo pipefail

          project_number="$(gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectNumber)')"
          default_node_service_account="${project_number}-compute@developer.gserviceaccount.com"

          raw_node_service_accounts="$(
            gcloud container clusters describe "${GKE_CLUSTER_NAME}" \
              --location "${GKE_LOCATION}" \
              --project "${GCP_PROJECT_ID}" \
              --format='value(nodePools[].config.serviceAccount)'
          )"

          if [[ -z "${raw_node_service_accounts//[[:space:];,]/}" ]]; then
            raw_node_service_accounts="default"
          fi

          mapfile -t node_service_accounts < <(
            printf '%s\n' "${raw_node_service_accounts}" |
              tr $';,\t ' '\n' |
              sed '/^[[:space:]]*$/d' |
              sort -u
          )

          for node_service_account in "${node_service_accounts[@]}"; do
            node_service_account="${node_service_account##*/}"

            if [[ "${node_service_account}" == "default" ]]; then
              node_service_account="${default_node_service_account}"
            fi

            if [[ "${node_service_account}" != *@* ]]; then
              echo "Could not resolve GKE node service account: ${node_service_account}" >&2
              exit 1
            fi

            echo "Granting Artifact Registry read access to GKE node service account: ${node_service_account}"
            gcloud artifacts repositories add-iam-policy-binding "${GAR_REPOSITORY}" \
              --location "${GAR_LOCATION}" \
              --project "${GCP_PROJECT_ID}" \
              --member "serviceAccount:${node_service_account}" \
              --role "roles/artifactregistry.reader" \
              --quiet >/dev/null
          done

      - name: Provision GCP agent demo resources
        id: agent_resources
        if: ${{ inputs.provision_agent_demo_resources }}
        env:
          INPUT_VERTEX_MODEL_ID: ${{ inputs.vertex_model_id }}
        run: |
          set -euo pipefail

          project_number="$(gcloud projects describe "${GCP_PROJECT_ID}" --format='value(projectNumber)')"
          agent_location="${VERTEX_LOCATION:-${GKE_LOCATION}}"
          bucket_name="starai-agent-pii-${project_number}-${agent_location}"
          service_account_id="starai-agent-pii-demo"
          service_account_email="${service_account_id}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"

          model_id="${INPUT_VERTEX_MODEL_ID:-${VERTEX_MODEL_ID:-gemini-2.5-flash}}"
          tf_vars=(
            -var="project_id=${GCP_PROJECT_ID}"
            -var="region=${agent_location}"
            -var="bucket_name=${bucket_name}"
          )

          terraform -chdir=infra/gcp/agent-demo init \
            -backend-config="bucket=${{ steps.tf_backend.outputs.bucket }}" \
            -backend-config="key=starai-chatbot/gcp-agent-demo.tfstate" \
            -backend-config="region=${{ steps.tf_backend.outputs.region }}" \
            -backend-config="dynamodb_table=${{ steps.tf_backend.outputs.dynamodb_table }}" \
            -backend-config="encrypt=true"

          terraform -chdir=infra/gcp/agent-demo import "${tf_vars[@]}" google_project_service.aiplatform "${GCP_PROJECT_ID}/aiplatform.googleapis.com" || true
          terraform -chdir=infra/gcp/agent-demo import "${tf_vars[@]}" google_project_service.storage "${GCP_PROJECT_ID}/storage.googleapis.com" || true
          terraform -chdir=infra/gcp/agent-demo import "${tf_vars[@]}" google_storage_bucket.starai_agent_pii "${bucket_name}" || true
          terraform -chdir=infra/gcp/agent-demo import "${tf_vars[@]}" google_service_account.starai_agent "projects/${GCP_PROJECT_ID}/serviceAccounts/${service_account_email}" || true

          terraform -chdir=infra/gcp/agent-demo apply -auto-approve "${tf_vars[@]}"

          bucket_name="$(terraform -chdir=infra/gcp/agent-demo output -raw agent_pii_bucket)"
          service_account_email="$(terraform -chdir=infra/gcp/agent-demo output -raw agent_service_account_email)"
          {
            echo "agent_provider=vertex"
            echo "agent_storage_provider=gcs"
            echo "agent_pii_bucket=${bucket_name}"
            echo "agent_demo_unsafe=true"
            echo "gcp_agent_service_account=${service_account_email}"
            echo "vertex_project_id=${GCP_PROJECT_ID}"
            echo "vertex_location=${agent_location}"
            echo "vertex_model_id=${model_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - id: vars
        name: Compute deployment variables
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_FLOW_ID: ${{ inputs.flow_id }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            IMG_TAG="${INPUT_IMAGE_TAG}"
          else
            IMG_TAG="${GITHUB_RUN_NUMBER}-$(git rev-parse --short=12 HEAD)"
          fi

          if [ -n "${INPUT_FLOW_ID}" ]; then
            FLOW_ID="${INPUT_FLOW_ID}"
          else
            FLOW_ID="${DEFAULT_FLOW_ID:-}"
          fi

          GAR_IMAGE="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/starai-chatbot"

          echo "img_tag=${IMG_TAG}" >> "${GITHUB_OUTPUT}"
          echo "flow_id=${FLOW_ID}" >> "${GITHUB_OUTPUT}"
          echo "gar_image=${GAR_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Download Wiz CLI
        run: |
          curl -o wizcli https://downloads.wiz.io/v1/wizcli/latest/wizcli-linux-amd64 && chmod +x wizcli
          ./wizcli version

      - name: Wiz CLI code scans (dir + iac + sensitive data)
        run: |
          set -euo pipefail
          mkdir -p wiz-reports

          ./wizcli dir scan --path . --policies=arun-vulnerabilities-policy,arun-secrets-policy,arun-sast-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/dir-scan-results.sarif || true
          ./wizcli iac scan --path . --types Kubernetes,GitHubActions,Terraform,Dockerfile --policies=arun-iac-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/iac-scan-results.sarif || true
          ./wizcli dir scan --path . --sensitive-data --policies=arun-sensitive-data-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/sensitive-data-scan-results.sarif || true
        continue-on-error: true

      - name: Build and push gateway image
        id: build_gateway
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.gar_image }}:${{ steps.vars.outputs.img_tag }}
            ${{ steps.vars.outputs.gar_image }}:latest

      - name: Wiz CLI docker scan + tag (gateway)
        run: |
          set -euo pipefail

          mkdir -p wiz-reports

          gateway_image="${{ steps.vars.outputs.gar_image }}:${{ steps.vars.outputs.img_tag }}"
          langflow_image="langflowai/langflow:1.2.0"
          echo "[INFO] Pulling gateway image locally for docker-based scanning: ${gateway_image}"
          docker pull "${gateway_image}" || true

          echo "[INFO] Wiz docker scan (gateway): ${gateway_image}"
          ./wizcli docker scan --image "${gateway_image}" --dockerfile app/Dockerfile --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/docker-scan-gateway.sarif || true

          echo "[INFO] Wiz docker tag (gateway): ${gateway_image} digest=${{ steps.build_gateway.outputs.digest }}"
          ./wizcli docker tag --image "${gateway_image}" --digest "${{ steps.build_gateway.outputs.digest }}" || true

          echo "[INFO] Pulling langflow image locally for docker-based scanning: ${langflow_image}"
          docker pull "${langflow_image}" || true

          echo "[INFO] Wiz docker scan (langflow): ${langflow_image}"
          ./wizcli docker scan --image "${langflow_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/docker-scan-langflow.sarif || true

          langflow_repodiagest="$(docker inspect --format='{{index .RepoDigests 0}}' "${langflow_image}" 2>/dev/null || true)"
          langflow_digest="${langflow_repodiagest##*@}"
          if [[ -n "${langflow_digest}" ]]; then
            echo "[INFO] Wiz docker tag (langflow): ${langflow_image} digest=${langflow_digest}"
            ./wizcli docker tag --image "${langflow_image}" --digest "${langflow_digest}" || true
          else
            echo "[WARN] Could not determine langflow image digest (RepoDigests empty); skipping wizcli docker tag" >&2
          fi

      - name: Wiz CLI scan images deployed to GKE
        run: |
          set -euo pipefail

          mkdir -p wiz-reports

          gateway_image="${{ steps.vars.outputs.gar_image }}:${{ steps.vars.outputs.img_tag }}"
          langflow_image="langflowai/langflow:1.2.0"

          echo "[INFO] Wiz scanning gateway image: ${gateway_image}"
          docker pull "${gateway_image}" || true
          ./wizcli scan container-image "${gateway_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-gateway.sarif || true

          echo "[INFO] Wiz scanning langflow image: ${langflow_image}"
          docker pull "${langflow_image}" || true
          ./wizcli scan container-image "${langflow_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-langflow.sarif || true

          if [[ -n "${{ inputs.langflow_seed_image }}" ]]; then
            seed_image_raw="${{ inputs.langflow_seed_image }}"
            if [[ "${seed_image_raw}" == *":"* ]]; then
              seed_image="docker.io/${seed_image_raw}"
            else
              seed_image="docker.io/${seed_image_raw}:latest"
            fi
            echo "[INFO] Wiz scanning langflow seed image: ${seed_image}"
            docker pull "${seed_image}" || true
            ./wizcli scan container-image "${seed_image}" --policies=arun-vulnerabilities-policy --tags github_action_run_id=${{ github.run_id }},project=arun-demo --stdout human --sarif-output-file wiz-reports/image-scan-seed.sarif || true
          fi

      - name: Upload Wiz SARIF reports
        if: ${{ always() && hashFiles('wiz-reports/*.sarif') != '' }}
        uses: ./.github/actions/upload-wiz-sarif

      - id: get-credentials
        name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER_NAME }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          namespace: chatbot

      - name: Apply runtime secrets
        env:
          MONGO_USER: ${{ secrets.MONGO_USER }}
          MONGO_PASS: ${{ secrets.MONGO_PASS }}
          MONGO_HOST: ${{ secrets.GCP_MONGO_HOST || secrets.MONGO_HOST }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          chmod +x ci/apply_gke_secrets.sh
          ./ci/apply_gke_secrets.sh

      - name: Deploy to GKE
        env:
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}
          GKE_CLUSTER_NAME: ${{ env.GKE_CLUSTER_NAME }}
          GKE_LOCATION: ${{ env.GKE_LOCATION }}
          GKE_STATIC_IP_NAME: ${{ env.GKE_STATIC_IP_NAME }}
          GAR_IMAGE_TAGGED: ${{ steps.vars.outputs.gar_image }}:${{ steps.vars.outputs.img_tag }}
          DEMO_MODE: ${{ inputs.demo_mode }}
          PUBLIC_DOMAIN: ${{ inputs.public_domain }}
          MANAGED_CERT_NAME: ${{ inputs.managed_certificate_name }}
          LANGFLOW_SEED_IMAGE: ${{ inputs.langflow_seed_image }}
          FLOW_ID: ${{ steps.vars.outputs.flow_id }}
          AGENT_PROVIDER: ${{ steps.agent_resources.outputs.agent_provider || vars.AGENT_PROVIDER }}
          AGENT_STORAGE_PROVIDER: ${{ steps.agent_resources.outputs.agent_storage_provider || vars.AGENT_STORAGE_PROVIDER }}
          AGENT_PII_BUCKET: ${{ steps.agent_resources.outputs.agent_pii_bucket || vars.AGENT_PII_BUCKET }}
          AGENT_DEMO_UNSAFE: ${{ steps.agent_resources.outputs.agent_demo_unsafe || vars.AGENT_DEMO_UNSAFE }}
          GCP_AGENT_SERVICE_ACCOUNT: ${{ steps.agent_resources.outputs.gcp_agent_service_account || vars.GCP_AGENT_SERVICE_ACCOUNT }}
          VERTEX_PROJECT_ID: ${{ steps.agent_resources.outputs.vertex_project_id || vars.VERTEX_PROJECT_ID || vars.GCP_PROJECT_ID }}
          VERTEX_LOCATION: ${{ steps.agent_resources.outputs.vertex_location || vars.VERTEX_LOCATION || vars.GKE_LOCATION }}
          VERTEX_MODEL_ID: ${{ steps.agent_resources.outputs.vertex_model_id || vars.VERTEX_MODEL_ID }}
        run: |
          chmod +x ci/deploy_gke.sh
          ./ci/deploy_gke.sh
